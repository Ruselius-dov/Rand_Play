name: CI/CD Production Verification
on:
  push:
    branches: [main, performance-audit-lr12]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check && pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-local
          path: test-results/
  production:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      # Existing Vercel Git integration owns deployment. Do not deploy twice.
      - name: Verify Vercel deployment for this exact commit
        run: node scripts/verify-deployment.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run regressions against production
        run: pnpm test
        env:
          BASE_URL: https://randplay-kappa.vercel.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-production
          path: test-results/
