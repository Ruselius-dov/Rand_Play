name: CI/CD Production Verification
on:
  push:
    branches: [main, production-quality]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check && pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-local
          path: test-results/
  production:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      # Existing Vercel Git integration owns deployment. Do not deploy twice.
      - name: Verify Vercel deployment for this exact commit
        run: node scripts/verify-deployment.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run regressions against production
        run: pnpm test
        env:
          BASE_URL: https://randplay-kappa.vercel.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-production
          path: test-results/
      - name: Audit the live mobile page
        run: |
          mkdir -p performance-results
          for attempt in 1 2 3; do
            pnpm --package=lighthouse@13.6.0 dlx lighthouse https://randplay-kappa.vercel.app --only-categories=performance,accessibility,best-practices,seo --output=html --output=json --output-path=performance-results/mobile-$attempt --chrome-flags="--headless --no-first-run" --quiet
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-production
          path: performance-results/
      - name: Check median mobile scores
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const dir = 'performance-results';
          const runs = fs.readdirSync(dir).filter(name => name.endsWith('.json')).map(name => JSON.parse(fs.readFileSync(dir + '/' + name)));
          if (runs.length !== 3 || runs.some(r => r.runtimeError || r.finalDisplayedUrl !== 'https://randplay-kappa.vercel.app/')) throw Error('Incomplete production audit');
          for (const key of ['performance', 'accessibility', 'best-practices', 'seo']) {
            const scores = runs.map(r => Math.round(r.categories[key].score * 100));
            const median = [...scores].sort((a,b) => a-b)[1];
            console.log(key, scores, 'median', median);
            if (median < 90) process.exitCode = 1;
          }
          JS
