<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Reset password | Rand_Play</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (CDN) + конфіг дизайн-системи. Preflight вимкнено, щоб не ламати style.css -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            corePlugins: { preflight: false, container: false },
            theme: {
                extend: {
                    colors: {
                        deep: '#0D0D0D',
                        surface: '#161616',
                        neon: '#2DD4BF',
                        ruby: '#E11D48',
                        muted: '#A3A3A3',
                        line: '#2A2A2D',
                        navy: { DEFAULT: '#162444', light: '#1E325C' }
                    },
                    fontFamily: {
                        heading: ['"Space Mono"', '"JetBrains Mono"', 'monospace'],
                        body: ['Inter', 'sans-serif']
                    },
                    spacing: { 18: '4.5rem' },
                    maxWidth: { content: '1264px' },
                    boxShadow: { glow: '0 0 30px rgba(45,212,191,0.2)' }
                }
            }
        };
    </script>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main id="main" class="flex flex-1 items-center justify-center px-4 py-8 lg:px-10">
        <div class="crt-monitor-fullscreen">
            <button type="button" id="lang-toggle" aria-label="Switch language to Ukrainian" title="Switch to Ukrainian" class="absolute right-4 top-4 z-50 flex min-h-11 min-w-11 items-center justify-center rounded-lg border border-zinc-500 bg-deep px-2 font-heading text-sm font-bold text-neon focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-neon">EN</button>
            <div class="crt-screen light-theme [--crt-turn-on-delay:0.3s]">
                <div class="scanlines"></div>

                <div class="relative z-20 flex min-h-0 flex-1 flex-col items-center overflow-y-auto p-4 sm:p-6">
                    <div class="my-auto w-full max-w-sm rounded-2xl border border-white/80 bg-white/50 p-4 text-navy backdrop-blur-sm sm:p-5">
                        <h1 class="font-heading text-2xl font-bold leading-tight text-navy">Reset password</h1>
                        <p class="mt-1 text-sm text-navy">Demo page: nothing is saved anywhere.</p>

                        <div id="reset-announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
                        <form id="resetForm" novalidate class="mt-4 flex flex-col gap-4">
                            <div>
                                <label for="reset-password" class="mb-1 block text-sm font-semibold text-navy">New password</label>
                                <input type="password" id="reset-password" name="password" autocomplete="new-password" required aria-invalid="false" aria-describedby="reset-passwordHint reset-passwordError" class="min-h-11 w-full rounded-lg border border-navy/60 bg-white/70 px-4 py-2 text-base text-navy transition duration-300 hover:border-navy focus:border-navy focus-visible:outline-navy motion-reduce:transition-none">
                                <p id="reset-passwordHint" class="mt-1 text-sm text-navy">8–64 characters, at least one letter and one digit.</p>
                                <p id="reset-passwordError" class="hidden mt-1 text-sm font-medium text-red-700"></p>
                            </div>

                            <div>
                                <label for="reset-confirm" class="mb-1 block text-sm font-semibold text-navy">Confirm new password</label>
                                <input type="password" id="reset-confirm" name="confirmPassword" autocomplete="new-password" required aria-invalid="false" aria-describedby="reset-confirmError" class="min-h-11 w-full rounded-lg border border-navy/60 bg-white/70 px-4 py-2 text-base text-navy transition duration-300 hover:border-navy focus:border-navy focus-visible:outline-navy motion-reduce:transition-none">
                                <p id="reset-confirmError" class="hidden mt-1 text-sm font-medium text-red-700"></p>
                            </div>

                            <button type="submit"
                                    class="flex min-h-11 w-full items-center justify-center rounded-xl bg-navy px-8 py-3 text-lg text-white transition duration-300 hover:-translate-y-0.5 hover:bg-navy-light active:translate-y-0 focus-visible:outline-navy motion-reduce:transition-none motion-reduce:hover:translate-y-0">
                                Change password
                            </button>

                            <p id="reset-status" class="hidden rounded-lg border border-navy/30 bg-white/70 p-3 text-sm text-navy" role="status"></p>
                        </form>

                        <a href="index.html" class="mt-2 inline-flex min-h-11 items-center gap-2 text-sm font-medium text-navy hover:text-navy-light hover:underline focus-visible:outline-navy">&larr; return to the main screen</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/i18n.js" defer></script>
    <script src="js/validation.js" defer></script>
    <script src="js/reset.js" defer></script>
</body>
</html>
